name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "mcrs"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 90 || 45 }}
    env:
      CHECKS_BASE_REF: origin/${{ github.base_ref || 'main' }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none


      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: read the test runner version
        id: nextest
        run: echo "version=$(sed -n 's/^nextest-version = "\(.*\)"/\1/p' .config/nextest.toml)" >> "$GITHUB_OUTPUT"

      - name: install the test runner
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@${{ steps.nextest.outputs.version }}

      - name: read the unused dependency checker version
        id: cargo-shear-version
        run: |
          echo "version=$(sed -n 's/^pub(crate) const VERSION: &str = "\(.*\)";$/\1/p' xtask/src/unused_deps.rs)" >> "$GITHUB_OUTPUT"

      - name: install the unused dependency checker
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-shear@${{ steps.cargo-shear-version.outputs.version }}

      - name: read the mutation testing tool version
        id: cargo-mutants-version
        run: |
          echo "version=$(sed -n 's/^pub(crate) const VERSION: &str = "\(.*\)";$/\1/p' xtask/src/mutation/tool.rs)" >> "$GITHUB_OUTPUT"

      - name: install the mutation testing tool
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@${{ steps.cargo-mutants-version.outputs.version }}

      # The release binary needs glibc 2.39, newer than the self-hosted runner's, and no static build is published.
      - name: build the mutation testing tool unless this version is installed
        if: runner.environment != 'github-hosted'
        env:
          VERSION: ${{ steps.cargo-mutants-version.outputs.version }}
        run: |
          if [ "$(cargo mutants --version 2>/dev/null)" != "cargo-mutants $VERSION" ]; then
            cargo install --locked --force cargo-mutants --version "$VERSION"
          fi

      - name: locate the client jar
        id: jar
        run: echo "dir=$HOME/.minecraft/versions/$(jq -r .id crates/mcrs_minecraft_client_jar/src/release.json)" >> "$GITHUB_OUTPUT"

      - name: restore the client jar
        id: jar-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.jar.outputs.dir }}
          key: client-jar-${{ hashFiles('crates/mcrs_minecraft_client_jar/src/release.json') }}

      - name: run the checks
        run: scripts/hooks/run-checks ci


      - name: save the client jar
        if: github.ref == 'refs/heads/main' && steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.jar.outputs.dir }}
          key: client-jar-${{ hashFiles('crates/mcrs_minecraft_client_jar/src/release.json') }}

  mutation-plan:
    name: mutation plan
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    env:
      CHECKS_BASE_REF: origin/${{ github.base_ref || 'main' }}
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: false
          cache-on-failure: true

      - name: read the mutation testing tool version
        id: cargo-mutants-version
        run: |
          echo "version=$(sed -n 's/^pub(crate) const VERSION: &str = "\(.*\)";$/\1/p' xtask/src/mutation/tool.rs)" >> "$GITHUB_OUTPUT"

      - name: install the mutation testing tool
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@${{ steps.cargo-mutants-version.outputs.version }}

      - name: plan the mutants in changed code
        id: plan
        run: |
          set -o pipefail
          scripts/hooks/run-checks mutants plan | tee "$RUNNER_TEMP/plan.log"
          grep -E '^(count|shards)=' "$RUNNER_TEMP/plan.log" >> "$GITHUB_OUTPUT"

      - name: keep the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: target/mutation/plan/
          if-no-files-found: ignore

  mutation-shard:
    name: mutation shard ${{ matrix.shard }}
    needs: mutation-plan
    if: needs.mutation-plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    env:
      CHECKS_BASE_REF: origin/${{ github.base_ref || 'main' }}
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Building a scope that reaches the renderer at opt-level 3 outgrows the hosted runner's 16 GB of memory.
      - name: add swap for the build
        run: |
          sudo fallocate -l 16G /swap-build
          sudo chmod 600 /swap-build
          sudo mkswap /swap-build
          sudo swapon /swap-build
          free -h

      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: read the test runner version
        id: nextest
        run: echo "version=$(sed -n 's/^nextest-version = "\(.*\)"/\1/p' .config/nextest.toml)" >> "$GITHUB_OUTPUT"

      - name: install the test runner
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@${{ steps.nextest.outputs.version }}

      - name: read the mutation testing tool version
        id: cargo-mutants-version
        run: |
          echo "version=$(sed -n 's/^pub(crate) const VERSION: &str = "\(.*\)";$/\1/p' xtask/src/mutation/tool.rs)" >> "$GITHUB_OUTPUT"

      - name: install the mutation testing tool
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@${{ steps.cargo-mutants-version.outputs.version }}

      - name: locate the client jar
        id: jar
        run: echo "dir=$HOME/.minecraft/versions/$(jq -r .id crates/mcrs_minecraft_client_jar/src/release.json)" >> "$GITHUB_OUTPUT"

      - name: restore the client jar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.jar.outputs.dir }}
          key: client-jar-${{ hashFiles('crates/mcrs_minecraft_client_jar/src/release.json') }}

      - name: fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: target/mutation/plan/

      - name: run the shard
        env:
          SHARD: ${{ matrix.shard }}
          CARGO_INCREMENTAL: 1
        run: scripts/hooks/run-checks mutants shard "$SHARD"

      - name: keep the shard's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: target/mutation/shards/
          if-no-files-found: ignore

  mutation-verdict:
    name: mutation verdict
    needs: [mutation-plan, mutation-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CHECKS_BASE_REF: origin/${{ github.base_ref || 'main' }}
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: fail unless the plan job passed
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
        run: test "$PLAN_RESULT" = success

      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: false
          cache-on-failure: true

      - name: fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: target/mutation/plan/

      - name: fetch the shards' output
        if: needs.mutation-plan.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          merge-multiple: true
          path: target/mutation/shards/

      - name: judge the mutants in changed code
        run: scripts/hooks/run-checks mutation

  checks:
    name: checks
    needs: [run, mutation-verdict]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: fail unless the checks and the mutation verdict passed
        env:
          RUN_RESULT: ${{ needs.run.result }}
          VERDICT_RESULT: ${{ needs.mutation-verdict.result }}
        run: test "$RUN_RESULT" = success && test "$VERDICT_RESULT" = success
