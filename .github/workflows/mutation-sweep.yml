name: mutation sweep

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      crate:
        description: sweep or measure only this crate, whatever its size
        required: false
        type: string
      kind:
        description: sweep a crate against its floor, or measure which of its tests kill mutants
        required: false
        type: choice
        options:
          - sweep
          - matrix
        default: sweep

permissions:
  contents: read

concurrency:
  group: mutation-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      kind: ${{ steps.plan.outputs.kind }}
      crates: ${{ steps.plan.outputs.crates }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: false
          cache-on-failure: true

      - name: read the mutation testing tool version
        id: cargo-mutants-version
        run: |
          echo "version=$(sed -n 's/^pub(crate) const VERSION: &str = "\(.*\)";$/\1/p' xtask/src/mutation/tool.rs)" >> "$GITHUB_OUTPUT"

      - name: install the mutation testing tool
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@${{ steps.cargo-mutants-version.outputs.version }}

      - name: list the earlier sweeps on main that have not expired
        run: |
          set -o pipefail
          mkdir -p target/mutation/sweep/previous
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("mutation-sweep-")) and .expired == false and .workflow_run.head_branch == "main") | {name, expired, created_at, run_id: .workflow_run.id, branch: .workflow_run.head_branch}' \
            | jq -s . > target/mutation/sweep/history.json

      - name: fetch the latest earlier result of each crate
        run: |
          set -o pipefail
          jq -r 'group_by(.name | sub("-[0-9a-f]{40}$"; "")) | map(max_by(.created_at)) | .[] | "\(.run_id) \(.name)"' target/mutation/sweep/history.json |
            while read -r run name; do
              gh run download "$run" --name "$name" --dir target/mutation/sweep/previous \
                || echo "::warning::the earlier result $name could not be fetched; it is compared with nothing"
            done

      - name: plan the sweep
        id: plan
        env:
          CRATE: ${{ inputs.crate }}
          KIND: ${{ inputs.kind }}
        run: |
          set -o pipefail
          args=(--kind "${KIND:-sweep}")
          if [ -n "$CRATE" ]; then args+=(--crate "$CRATE"); fi
          scripts/hooks/run-checks mutants sweep-plan "${args[@]}" | tee "$RUNNER_TEMP/plan.log"
          grep -E '^(count|shards|kind|crates)=' "$RUNNER_TEMP/plan.log" >> "$GITHUB_OUTPUT"

      - name: keep the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: target/mutation/plan/
          if-no-files-found: error

      - name: keep the earlier results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-previous
          path: target/mutation/sweep/previous/
          if-no-files-found: error

  shard:
    name: shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # Building a scope that reaches the renderer at opt-level 3 outgrows the hosted runner's 16 GB of memory.
      - name: add swap for the build
        run: |
          sudo fallocate -l 16G /swap-build
          sudo chmod 600 /swap-build
          sudo mkswap /swap-build
          sudo swapon /swap-build
          free -h

      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: read the test runner version
        id: nextest
        run: echo "version=$(sed -n 's/^nextest-version = "\(.*\)"/\1/p' .config/nextest.toml)" >> "$GITHUB_OUTPUT"

      - name: install the test runner
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@${{ steps.nextest.outputs.version }}

      - name: read the mutation testing tool version
        id: cargo-mutants-version
        run: |
          echo "version=$(sed -n 's/^pub(crate) const VERSION: &str = "\(.*\)";$/\1/p' xtask/src/mutation/tool.rs)" >> "$GITHUB_OUTPUT"

      - name: install the mutation testing tool
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@${{ steps.cargo-mutants-version.outputs.version }}

      - name: locate the client jar
        id: jar
        run: echo "dir=$HOME/.minecraft/versions/$(jq -r .id crates/mcrs_minecraft_client_jar/src/release.json)" >> "$GITHUB_OUTPUT"

      - name: restore the client jar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.jar.outputs.dir }}
          key: client-jar-${{ hashFiles('crates/mcrs_minecraft_client_jar/src/release.json') }}

      - name: fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: target/mutation/plan/

      - name: run the shard
        env:
          SHARD: ${{ matrix.shard }}
          CARGO_INCREMENTAL: 1
        run: scripts/hooks/run-checks mutants shard "$SHARD"

      - name: keep the shard's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: target/mutation/shards/
          if-no-files-found: ignore

  merge:
    name: merge
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      raises: ${{ steps.ratchet.outputs.raises }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: fail unless the plan job passed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success

      - name: check out the commit under test with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: restore the build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: false
          cache-on-failure: true

      - name: fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: target/mutation/plan/

      - name: fetch the shards' output
        if: needs.plan.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          merge-multiple: true
          path: target/mutation/shards/

      - name: fetch the earlier results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-previous
          path: target/mutation/sweep/previous/

      - name: merge the shards into one result per crate
        env:
          KIND: ${{ needs.plan.outputs.kind }}
          CRATE: ${{ inputs.crate }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          if [ "$KIND" = matrix ]; then
            scripts/hooks/run-checks mutants matrix-merge "$CRATE" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            scripts/hooks/run-checks mutants merge --run-id "$RUN_ID" --run-url "$RUN_URL" --date "$(date -u +%F)" --branch "$BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: keep this run's results
        if: always() && needs.plan.outputs.kind == 'sweep'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: target/mutation/sweep/results/
          if-no-files-found: ignore

      - name: keep the kill matrix
        if: needs.plan.outputs.kind == 'matrix'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-matrix-${{ inputs.crate }}-${{ github.sha }}
          path: target/mutation/matrix/${{ inputs.crate }}/
          if-no-files-found: error

      - name: judge the sweeps against their floors
        id: ratchet
        env:
          KIND: ${{ needs.plan.outputs.kind }}
        run: |
          set -o pipefail
          if [ "$KIND" != sweep ]; then
            echo "raises=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/hooks/run-checks mutants ratchet | tee "$RUNNER_TEMP/ratchet.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^raises=' "$RUNNER_TEMP/ratchet.log" >> "$GITHUB_OUTPUT"

      - name: keep the proposed floors change
        if: steps.ratchet.outputs.raises != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-raise
          path: target/mutation/raise/
          if-no-files-found: error

  keep:
    name: keep ${{ matrix.crate }}
    needs: [plan, merge]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.kind == 'sweep'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.plan.outputs.crates) }}
    steps:
      - name: fetch this run's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-results
          path: target/mutation/sweep/results/

      - name: keep the result of the crate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-sweep-${{ matrix.crate }}-${{ github.sha }}
          path: target/mutation/sweep/results/${{ matrix.crate }}.json
          if-no-files-found: error

  raise:
    name: raise
    needs: merge
    if: github.ref == 'refs/heads/main' && needs.merge.outputs.raises != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: fetch the proposed floors change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-raise
          path: target/mutation/raise/

      - name: use the proposed floors file as it is
        run: |
          for file in floors.toml body.md; do
            if [ ! -s "target/mutation/raise/$file" ]; then
              echo "::error::the mutation-raise artifact holds no $file, so there is nothing to propose"
              exit 1
            fi
          done
          if cmp -s target/mutation/raise/floors.toml quality/floors.toml; then
            echo "::error::the proposed floors file is identical to the one on main, so no floor rises"
            exit 1
          fi
          cp target/mutation/raise/floors.toml quality/floors.toml

      - name: require the app credentials
        env:
          CLIENT_ID: ${{ secrets.MUTATION_FLOORS_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.MUTATION_FLOORS_APP_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$CLIENT_ID" ]; then missing="MUTATION_FLOORS_APP_CLIENT_ID"; fi
          if [ -z "$PRIVATE_KEY" ]; then missing="${missing:+$missing and }MUTATION_FLOORS_APP_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            {
              echo '### Proposed floors change'
              echo
              echo '```diff'
              git diff -- quality/floors.toml
              echo '```'
              echo
              cat target/mutation/raise/body.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the secret $missing is not set, so the floor raise cannot open its pull request; the proposed change is in the job summary"
            exit 1
          fi

      - name: mint a token for the app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MUTATION_FLOORS_APP_CLIENT_ID }}
          private-key: ${{ secrets.MUTATION_FLOORS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: commit the raise to its branch
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot="${SLUG}[bot]"
          id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git switch -C chore/quality/raise-mutation-floors
          git add quality/floors.toml
          git commit -m "chore(quality): raise mutation floors"
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" HEAD:refs/heads/chore/quality/raise-mutation-floors

      - name: open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list --head chore/quality/raise-mutation-floors --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore(quality): raise mutation floors" --body-file target/mutation/raise/body.md
          else
            gh pr create --base main --head chore/quality/raise-mutation-floors --title "chore(quality): raise mutation floors" --body-file target/mutation/raise/body.md
          fi
